services:
  web:
    build:
      context: .
      target: deps
    command: npm run dev -- --hostname 0.0.0.0
    user: node
    working_dir: /app
    ports:
      - "${APP_PORT:-3082}:3000"
    volumes:
      - .:/app
      - meu_treino_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  meu_treino_node_modules:
